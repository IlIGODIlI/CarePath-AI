version: '3.8'

services:
  api:
    build: .
    container_name: carepath_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      - UPLOADS_DIRECTORY=/app/data/uploads
    volumes:
      - ./data:/app/data

  ui:
    build: .
    container_name: carepath_ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
