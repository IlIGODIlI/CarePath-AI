[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carepath-ai"
version = "0.1.0"
description = "Enterprise Multi-Modal Medical Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CarePath AI Team" }
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "monai>=1.3.0",
    "pydicom>=2.4.4",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0",
    "easyocr>=1.7.1",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "spacy>=3.7.0",
    "transformers>=4.38.0",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.5.0",
    "google-generativeai>=0.4.0",
    "streamlit>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
